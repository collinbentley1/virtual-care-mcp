name: DHI ordinary PR negative canary

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions: {}

jobs:
  denied-environment:
    name: Ordinary PR must be denied DHI environment access
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    environment: dhi-base-prefetch-20260822-098dca9280b3
    permissions: {}
    steps:
      - name: Fail if the PR reaches a runner inside the environment
        run: |
          echo "Negative canary failed: an ordinary PR entered the protected DHI environment." >&2
          exit 1
